name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tokn version
      placeholder: "1.0.49"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.5"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or error messages help. Never paste your session key.
